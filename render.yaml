services:
  - type: web
    name: starhub-manifest-proxy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
